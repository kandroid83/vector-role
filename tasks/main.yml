---
- name: Download Vector .deb package
  ansible.builtin.get_url:
    url: "{{ vector_deb_url }}"
    dest: "/tmp/vector_{{ vector_version }}-1_{{ vector_arch }}.deb"
    mode: '0644'

- name: Install Vector from .deb
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ vector_version }}-1_{{ vector_arch }}.deb"

- name: Create Vector config directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Vector config from template
  ansible.builtin.template:
    src: "vector.toml.j2"
    dest: "{{ vector_config_dir }}/vector.toml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart vector

- name: Ensure Vector service is enabled and running
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
